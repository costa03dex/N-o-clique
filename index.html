<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NÃO CLIQUE!</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #1e293b);
    color: white;
    min-height: 100vh;
    overflow: hidden;
}

header {
    text-align: center;
    padding: 25px 10px 10px;
}

h1 {
    font-size: 42px;
    margin-bottom: 8px;
}

.subtitulo {
    color: #cbd5e1;
}

.progresso {
    width: 90%;
    max-width: 700px;
    margin: 25px auto;
}

.barra {
    width: 100%;
    height: 25px;
    background: #334155;
    border-radius: 20px;
    overflow: hidden;
}

.barraInterna {
    height: 100%;
    width: 0%;
    background: #22c55e;
    transition: 0.3s;
}

.info {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 18px;
}

#contador {
    font-size: 75px;
    font-weight: bold;
    text-align: center;
    margin-top: 20px;
}

.botaoClique {
    display: block;
    margin: 25px auto;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 8px solid #facc15;
    background: #ef4444;
    color: white;
    font-size: 35px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 12px 0 #991b1b;
    transition: 0.1s;
}

.botaoClique:hover {
    transform: scale(1.04);
}

.botaoClique:active {
    transform: translateY(10px) scale(0.98);
    box-shadow: 0 2px 0 #991b1b;
}

#petArea {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(15, 23, 42, 0.9);
    border: 2px solid #475569;
    border-radius: 15px;
    padding: 12px 18px;
    min-width: 210px;
}

.petEmoji {
    font-size: 45px;
    text-align: center;
}

.petNome {
    text-align: center;
    font-weight: bold;
    margin-top: 3px;
}

.petFala {
    color: #cbd5e1;
    text-align: center;
    margin-top: 5px;
    font-size: 14px;
}

#petsBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    background: #8b5cf6;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#petsMenu {
    display: none;
    position: fixed;
    top: 75px;
    right: 20px;
    width: 300px;
    max-height: 75vh;
    overflow-y: auto;
    background: #0f172a;
    border: 2px solid #475569;
    border-radius: 15px;
    padding: 15px;
    z-index: 20;
}

#petsMenu h2 {
    text-align: center;
    margin-bottom: 12px;
}

.petCard {
    background: #1e293b;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 2px solid transparent;
}

.petCard:hover {
    border-color: #8b5cf6;
}

.petCard.desbloqueado {
    border-color: #22c55e;
}

.petCard.bloqueado {
    opacity: 0.5;
    cursor: not-allowed;
}

.petCardEmoji {
    font-size: 35px;
}

.petCardNome {
    font-weight: bold;
}

.petCardRequisito {
    font-size: 13px;
    color: #cbd5e1;
}

#modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    align-items: center;
    justify-content: center;
    z-index: 50;
}

.modalCaixa {
    width: 90%;
    max-width: 450px;
    background: #1e293b;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    border: 3px solid #8b5cf6;
}

.modalCaixa h2 {
    font-size: 28px;
    margin-bottom: 15px;
}

.modalCaixa p {
    margin-bottom: 20px;
    line-height: 1.5;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 18px;
    text-align: center;
    margin-bottom: 12px;
}

.modalBtn {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.fecharBtn {
    background: #64748b;
    margin-left: 5px;
}

#eventoMensagem {
    color: #facc15;
    font-weight: bold;
    margin-top: 10px;
}

.creditos {
    position: fixed;
    right: 18px;
    bottom: 15px;
    font-size: 15px;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.35);
    padding: 8px 12px;
    border-radius: 10px;
    backdrop-filter: blur(5px);
    z-index: 50;
}

#secretStatus {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(15,23,42,0.85);
    padding: 10px 14px;
    border-radius: 10px;
    color: #facc15;
    font-size: 14px;
}

@media (max-width: 600px) {
    h1 {
        font-size: 32px;
    }

    #contador {
        font-size: 55px;
    }

    .botaoClique {
        width: 180px;
        height: 180px;
        font-size: 28px;
    }

    #petArea {
        min-width: 170px;
    }

    .creditos {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🚫 NÃO CLIQUE!</h1>
    <div class="subtitulo">Você consegue chegar até o fim?</div>
</header>

<div id="secretStatus">
    🔐 Eventos Secretos: <span id="secretosEncontrados">0</span>/5
</div>

<div class="progresso">

    <div class="barra">
        <div class="barraInterna" id="barra"></div>
    </div>

    <div class="info">
        <span>Cliques: <b id="cliquesTexto">0</b></span>
        <span>🏆 Recorde: <b id="metaTexto">100</b></span>
    </div>

</div>

<div id="contador">0</div>

<button class="botaoClique" onclick="clicar()">
    NÃO CLIQUE
</button>

<button id="petsBtn" onclick="abrirPets()">
    🐾 PETS
</button>

<div id="petArea">
    <div class="petEmoji" id="petEmoji">🐶</div>
    <div class="petNome" id="petNome">Bob</div>
    <div class="petFala" id="petFala">
        Você consegue! 🐾
    </div>
</div>

<div id="petsMenu">

    <h2>🐾 Seus Pets</h2>

    <div id="listaPets"></div>

</div>

<div id="modal">

    <div class="modalCaixa">

        <h2 id="modalTitulo">Evento</h2>

        <p id="modalTexto"></p>

        <div id="campoCodigo">
            <input id="codigoInput" placeholder="Digite o código">
        </div>

        <div id="eventoMensagem"></div>

        <button class="modalBtn" id="botaoPrincipal" onclick="confirmarModal()">
            Confirmar
        </button>

        <button class="modalBtn fecharBtn" onclick="fecharModal()">
            Fechar
        </button>

    </div>

</div>

<div class="creditos">
    Desenvolvido por: Anna Jullya
</div>

<script>

/* =========================
   DADOS DO JOGO
========================= */

let cliques = Number(localStorage.getItem("cliques")) || 0;

let meta = Number(localStorage.getItem("meta")) || 100;

let fase = Number(localStorage.getItem("fase")) || 1;

let petAtual = localStorage.getItem("petAtual") || "bob";

let secretosEncontrados =
    Number(localStorage.getItem("secretosEncontrados")) || 0;

let eventosUsados =
    JSON.parse(localStorage.getItem("eventosUsados") || "[]");

let codigoAtual = "";

let tipoModal = "";


/* =========================
   PETS
========================= */

const pets = {

    bob: {
        emoji: "🐶",
        nome: "Bob",
        requisito: 0,
        falas: [
            "Você consegue! 🐾",
            "Continua clicando!",
            "Não desista!",
            "Eu acredito em você!"
        ]
    },

    mia: {
        emoji: "🐱",
        nome: "Mia",
        requisito: 100,
        falas: [
            "Miau! Mais alguns cliques!",
            "Você está indo muito bem!",
            "Não pare agora!"
        ]
    },

    frog: {
        emoji: "🐸",
        nome: "Frog",
        requisito: 250,
        falas: [
            "Ribbit! Continue!",
            "Você está ficando rápido!",
            "Vamos conseguir!"
        ]
    },

    panda: {
        emoji: "🐼",
        nome: "Panda",
        requisito: 500,
        falas: [
            "🐼 Força!",
            "Você chegou longe!",
            "Não desista!"
        ]
    },

    fox: {
        emoji: "🦊",
        nome: "Fox",
        requisito: 1000,
        falas: [
            "Você está imparável!",
            "Mil cliques? Fácil!",
            "Continue!"
        ]
    },

    dragon: {
        emoji: "🐲",
        nome: "Dragão",
        requisito: 2000,
        falas: [
            "🔥 O poder do dragão está com você!",
            "Nada pode te parar!",
            "Você chegou muito longe!"
        ]
    }

};


/* =========================
   EVENTOS SECRETOS
========================= */

const eventosSecretos = [

    {
        id: "evento1",
        titulo: "👀 VOCÊ ENCONTROU ALGO...",
        texto: "Você descobriu um dos segredos escondidos do jogo!"
    },

    {
        id: "evento2",
        titulo: "🕵️ DETETIVE!",
        texto: "Parabéns! Você percebeu uma coisa que quase ninguém percebe."
    },

    {
        id: "evento3",
        titulo: "🤨 ISSO NÃO DEVERIA ACONTECER",
        texto: "O jogo percebeu que você está clicando DEMAIS..."
    },

    {
        id: "evento4",
        titulo: "🎁 PRESENTE SECRETO!",
        texto: "Você encontrou um evento secreto escondido!"
    },

    {
        id: "evento5",
        titulo: "👑 LENDÁRIO!",
        texto: "Você encontrou TODOS os eventos secretos!"
    }

];


/* =========================
   ATUALIZAR TELA
========================= */

function atualizarTela() {

    document.getElementById("cliquesTexto").textContent = cliques;

    document.getElementById("contador").textContent = cliques;

    document.getElementById("metaTexto").textContent = meta;

    document.getElementById("secretosEncontrados").textContent =
        secretosEncontrados;

    let porcentagem = (cliques / meta) * 100;

    if (porcentagem > 100) {
        porcentagem = 100;
    }

    document.getElementById("barra").style.width =
        porcentagem + "%";

    atualizarPet();

    localStorage.setItem("cliques", cliques);

    localStorage.setItem("meta", meta);

    localStorage.setItem("fase", fase);

    localStorage.setItem("petAtual", petAtual);

    localStorage.setItem(
        "secretosEncontrados",
        secretosEncontrados
    );

    localStorage.setItem(
        "eventosUsados",
        JSON.stringify(eventosUsados)
    );
}


/* =========================
   CLIQUE PRINCIPAL
========================= */

function clicar() {

    cliques++;

    atualizarTela();

    /* Desafio a cada 50 */

    if (
        cliques % 50 === 0 &&
        cliques < meta
    ) {
        setTimeout(abrirDesafio, 300);
        return;
    }

    /* Recorde */

    if (cliques >= meta) {

        setTimeout(abrirCodigo, 300);

        return;
    }

    /* Eventos secretos */

    verificarEventoSecreto();

}


/* =========================
   EVENTOS SECRETOS
========================= */

function verificarEventoSecreto() {

    if (secretosEncontrados >= 5) {
        return;
    }

    let numeroAleatorio = Math.random();

    /*
       Pequena chance de evento aparecer
    */

    if (numeroAleatorio < 0.015) {

        let disponiveis =
            eventosSecretos.filter(
                evento => !eventosUsados.includes(evento.id)
            );

        if (disponiveis.length === 0) {
            return;
        }

        let evento =
            disponiveis[
                Math.floor(
                    Math.random() * disponiveis.length
                )
            ];

        eventosUsados.push(evento.id);

        secretosEncontrados++;

        abrirEventoSecreto(evento);
    }
}


function abrirEventoSecreto(evento) {

    tipoModal = "secreto";

    document.getElementById("modalTitulo").textContent =
        evento.titulo;

    document.getElementById("modalTexto").textContent =
        evento.texto;

    document.getElementById("campoCodigo").style.display =
        "none";

    document.getElementById("eventoMensagem").textContent =
        "🔐 Evento secreto descoberto!";

    document.getElementById("botaoPrincipal").textContent =
        "Continuar";

    document.getElementById("modal").style.display =
        "flex";

    atualizarTela();
}


/* =========================
   DESAFIOS
========================= */

const desafios = [

    {
        pergunta: "Quanto é 5 + 5?",
        resposta: "10"
    },

    {
        pergunta: "Qual é a capital do Brasil?",
        resposta: "brasilia"
    },

    {
        pergunta: "Quanto é 10 × 2?",
        resposta: "20"
    },

    {
        pergunta: "Quantos lados tem um quadrado?",
        resposta: "4"
    },

    {
        pergunta: "Qual planeta é conhecido como Planeta Vermelho?",
        resposta: "marte"
    }

];


let desafioAtual;


/* =========================
   ABRIR DESAFIO
========================= */

function abrirDesafio() {

    tipoModal = "desafio";

    desafioAtual =
        desafios[
            Math.floor(
                Math.random() * desafios.length
            )
        ];

    document.getElementById("modalTitulo").textContent =
        "🧠 DESAFIO!";

    document.getElementById("modalTexto").textContent =
        desafioAtual.pergunta;

    document.getElementById("campoCodigo").style.display =
        "block";

    document.getElementById("codigoInput").value = "";

    document.getElementById("codigoInput").placeholder =
        "Digite sua resposta";

    document.getElementById("eventoMensagem").textContent =
        "Se errar, seus cliques voltam para 0! 😈";

    document.getElementById("botaoPrincipal").textContent =
        "Responder";

    document.getElementById("modal").style.display =
        "flex";

}


/* =========================
   CÓDIGO DO RECORDE
========================= */

function abrirCodigo() {

    tipoModal = "codigo";

    codigoAtual =
        Math.floor(
            1000 + Math.random() * 9000
        ).toString();

    document.getElementById("modalTitulo").textContent =
        "🔐 VOCÊ CHEGOU AO RECORDE!";

    document.getElementById("modalTexto").innerHTML =
        "Seu código é:<br><br><strong style='font-size:35px'>" +
        codigoAtual +
        "</strong><br><br>Digite o código para continuar.";

    document.getElementById("campoCodigo").style.display =
        "block";

    document.getElementById("codigoInput").value = "";

    document.getElementById("codigoInput").placeholder =
        "Digite o código";

    document.getElementById("eventoMensagem").textContent =
        "";

    document.getElementById("botaoPrincipal").textContent =
        "Desbloquear";

    document.getElementById("modal").style.display =
        "flex";
}


/* =========================
   CONFIRMAR MODAL
========================= */

function confirmarModal() {

    let resposta =
        document.getElementById("codigoInput").value
        .trim()
        .toLowerCase();

    /* Evento secreto */

    if (tipoModal === "secreto") {

        fecharModal();

        return;
    }


    /* Desafio */

    if (tipoModal === "desafio") {

        if (
            resposta ===
            desafioAtual.resposta.toLowerCase()
        ) {

            document.getElementById("eventoMensagem").textContent =
                "✅ Acertou! Continue!";

            setTimeout(() => {
                fecharModal();
            }, 700);

        } else {

            document.getElementById("eventoMensagem").textContent =
                "❌ Errou! Os cliques voltaram para 0!";

            cliques = 0;

            atualizarTela();

            setTimeout(() => {
                fecharModal();
            }, 1000);
        }

        return;
    }


    /* Código */

    if (tipoModal === "codigo") {

        if (resposta === codigoAtual) {

            meta += 100;

            fase++;

            document.getElementById("eventoMensagem").textContent =
                "🎉 Código correto! Novo recorde desbloqueado!";

            atualizarTela();

            setTimeout(() => {
                fecharModal();
            }, 1000);

        } else {

            document.getElementById("eventoMensagem").textContent =
                "❌ Código errado! Tente novamente.";
        }

    }

}


/* =========================
   FECHAR MODAL
========================= */

function fecharModal() {

    document.getElementById("modal").style.display =
        "none";

    document.getElementById("codigoInput").value =
        "";

    document.getElementById("eventoMensagem").textContent =
        "";

}


/* =========================
   PETS
========================= */

function atualizarPet() {

    let pet = pets[petAtual];

    document.getElementById("petEmoji").textContent =
        pet.emoji;

    document.getElementById("petNome").textContent =
        pet.nome;

    /*
       Troca a fala de vez em quando
    */

    if (cliques % 15 === 0 && cliques !== 0) {

        let fala =
            pet.falas[
                Math.floor(
                    Math.random() * pet.falas.length
                )
            ];

        document.getElementById("petFala").textContent =
            fala;
    }

}


/* =========================
   MENU DE PETS
========================= */

function abrirPets() {

    let menu =
        document.getElementById("petsMenu");

    if (menu.style.display === "block") {

        menu.style.display = "none";

    } else {

        menu.style.display = "block";

        montarPets();

    }

}


function montarPets() {

    let lista =
        document.getElementById("listaPets");

    lista.innerHTML = "";

    for (let id in pets) {

        let pet = pets[id];

        let desbloqueado =
            cliques >= pet.requisito;

        let card =
            document.createElement("div");

        card.className =
            "petCard " +
            (desbloqueado
                ? "desbloqueado"
                : "bloqueado");

        card.innerHTML = `
            <div class="petCardEmoji">
                ${pet.emoji}
            </div>

            <div class="petCardNome">
                ${pet.nome}
            </div>

            <div class="petCardRequisito">
                ${
                    pet.requisito === 0
                    ? "Desbloqueado"
                    : "Precisa de " +
                      pet.requisito +
                      " cliques"
                }
            </div>
        `;

        if (desbloqueado) {

            card.onclick = function() {

                petAtual = id;

                atualizarTela();

                montarPets();

            };

        }

        lista.appendChild(card);

    }

}


/* =========================
   INICIAR
========================= */

atualizarTela();

</script>

</body>
</html>
